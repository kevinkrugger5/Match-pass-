<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchPass</title>
<style>
body{font-family:Arial;margin:0;background:#f1f5f9;color:#172033}
header{background:#0f172a;color:white;text-align:center;padding:20px}
.hero{text-align:center;background:#1e293b;color:white;padding:50px 20px}
.container{max-width:800px;margin:auto;padding:30px 15px}
.card{background:white;padding:20px;margin:20px 0;border-radius:15px}
button{width:100%;padding:14px;background:#16a34a;color:white;border:0;border-radius:8px;font-size:16px}
.price{font-weight:bold;font-size:20px;margin:15px 0}
footer{text-align:center;background:#0f172a;color:white;padding:25px}
</style>
</head>

<body>

<header>
<h1>⚽ MatchPass</h1>
<p>Online Match Ticketing Platform</p>
</header>

<section class="hero">
<h2>Get Your Match Tickets</h2>
<p>Find upcoming matches and reserve your ticket online.</p>
</section>

<div class="container">

<h2>Upcoming Matches</h2>

<div class="card">
<h3>⚽ Local Football Match</h3>
<p>📅 Date: Coming Soon</p>
<p>📍 Venue: Coming Soon</p>
<p>🕐 Time: Coming Soon</p>
<div class="price">KSh 500</div>
<button onclick="buy()">Buy Ticket</button>
</div>

</div>

<footer>
<p>⚽ MatchPass</p>
<p>© 2026 MatchPass</p>
</footer>

<script>
function buy(){
alert("Ticket booking coming soon.");
}
</script>

</body>
</html>
